services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18766:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./topics:/usr/share/nginx/html/topics:ro
      - ./geojson:/usr/share/nginx/html/geojson:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./llms.txt:/usr/share/nginx/html/llms.txt:ro
      - ./LICENSE:/usr/share/nginx/html/LICENSE:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
